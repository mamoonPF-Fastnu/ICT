<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }                                                 
        .page {
            width: 75%;
            margin: 20px auto;
            text-align: center;
        }

        .header,
        .footer {
            background-color: green;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 5px;
        }

        .content {
            display: flex;
            min-height: 350px;
            color: navy;
            font-weight: bold;
        }

        .left,
        .center,
        .right {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .left {
            flex: 0 0 20%;
            background-color: magenta;
            line-height: 2.4;
        }

        .center {
            flex: 0 0 55%;
            background-color: red;
            font-size: 18px;
        }

        .right {
            flex: 0 0 25%;
            background-color: lime;
        }

        @media (max-width: 600px) {
            .page {
                width: 90%;
            }

            .content {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">This is header</div>
        <div class="content">
            <div class="left">Left<br>Content</div>
            <div class="center">Center Content</div>
            <div class="right">Right Content</div>
        </div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
