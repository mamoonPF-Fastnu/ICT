<!DOCTYPE html>
<html>
<head>
    <title>Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-box">

        <form>

            <div class="row">
                <label>Family name</label>
                <input type="text" placeholder="Family name">
            </div>

            <div class="row">
                <label>Other name</label>
                <input type="text" placeholder="Other names">
            </div>

            <div class="row">
                <label>Address</label>
                <input type="text" placeholder="Address">
            </div>

            <div class="row">
                <label>Suburb</label>
                <select>
                    <option>Vic (drop down menu)</option>
                    <option>Karachi</option>
                    <option>Lahore</option>
                    <option>Islamabad</option>
                </select>
            </div>

            <div class="row">
                <label>State/Territory</label>
            </div>

            <div class="section">

                <label>Course info On:</label>

                <div class="choices">
                    <div><input type="checkbox"> Engineering</div>
                    <div><input type="checkbox"> IT</div>
                    <div><input type="checkbox"> Law</div>
                    <div><input type="checkbox"> Medicine</div>
                    <div><input type="checkbox"> Nursing</div>
                </div>

            </div>

            <div class="section">

                <label>Degree</label>

                <div class="choices">
                    <div><input type="radio" name="degree"> Diploma</div>
                    <div><input type="radio" name="degree"> Degree</div>
                    <div><input type="radio" name="degree"> Honours</div>
                    <div><input type="radio" name="degree"> Masters</div>
                    <div><input type="radio" name="degree"> PhD</div>
                </div>

            </div>

            <div class="comments">
                <label>Comments</label>
                <textarea></textarea>
            </div>

            <div class="buttons">
                <button type="submit">Submit</button>
                <button type="reset">Clear Form</button>
            </div>

        </form>

    </div>

</body>
</html>
