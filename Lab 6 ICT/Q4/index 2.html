<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<table>
    <tr>
        <th rowspan="2">Name of Train</th>
        <th rowspan="2">Place</th>
        <th rowspan="2">Destination</th>
        <th rowspan="2">Train No.</th>
        <th colspan="2">Time</th>
        <th rowspan="2">Fair</th>
    </tr>
    <tr>
        <th>Arrival</th>
        <th>Departure</th>
    </tr>

    <tr>
        <td>Train 1</td>
        <td>Hyderabad</td>
        <td>Delhi</td>
        <td>12345</td>
        <td>10:00 AM</td>
        <td>11:00 AM</td>
        <td>500</td>
    </tr>

    <tr>
        <td>Train 2</td>
        <td>Chennai</td>
        <td>Mumbai</td>
        <td>67890</td>
        <td>2:00 PM</td>
        <td>3:00 PM</td>
        <td>800</td>
    </tr>

    <tr>
        <td>Train 3</td>
        <td> Bangalore</td>
        <td> Kolkata</td>
        <td>11223</td>
        <td>4:00 PM</td>
        <td>5:00 PM</td>
        <td>1000</td>
    </tr>
